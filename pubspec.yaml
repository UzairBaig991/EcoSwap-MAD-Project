name: ecoswap
description: "EcoSwap - A hyperlocal sustainable marketplace mobile app for swapping, giving away, and buying pre-loved items."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Network
  http: ^1.2.0

  # UI & Styling
  cupertino_icons: ^1.0.8
  google_fonts: ^6.1.0
  flutter_spinkit: ^5.2.0
  shimmer: ^3.0.0
  flutter_rating_bar: ^4.0.1
  animated_text_kit: ^4.2.2
  badges: ^3.1.2

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Routing
  go_router: ^13.2.0

  # Firebase Core & Auth & DB & Storage
  firebase_core: ^2.27.0
  firebase_auth: ^4.17.8
  cloud_firestore: ^4.15.8
  firebase_storage: ^11.6.9
  firebase_messaging: ^14.7.19
  google_sign_in: ^6.2.1

  # Location & Maps
  google_maps_flutter: ^2.5.3
  geolocator: ^11.0.0
  permission_handler: ^11.3.0
  dart_geohash: ^2.0.2

  # Media & Picker
  image_picker: ^1.0.7
  flutter_image_compress: ^2.1.8
  cached_network_image: ^3.3.1

  # Local DB & Persistence
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.2

  # Serialization
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1

  # Utilities & Helpers
  intl: ^0.19.0
  timeago: ^3.6.1
  share_plus: ^8.0.2
  url_launcher: ^6.2.5
  flutter_local_notifications: ^17.0.0
  uuid: ^4.3.3
  equatable: ^2.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.8
  freezed: ^2.4.7
  json_serializable: ^6.7.1
  hive_generator: ^2.0.1
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
